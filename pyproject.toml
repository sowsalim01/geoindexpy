[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoindexpy"
version = "0.1.0"
description = "A modern scientific Python library for spectral and geospatial index computation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "GeoIndexPy Contributors" }
]
keywords = [
    "remote-sensing",
    "earth-observation",
    "spectral-indices",
    "gis",
    "raster",
    "ndvi",
    "multispectral",
    "hyperspectral",
    "satellite",
    "geospatial"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
    "rasterio>=1.3.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7.0",
]
xarray = [
    "xarray>=2023.1.0",
    "rioxarray>=0.15.0",
]
dask = [
    "dask>=2023.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]
all = [
    "geoindexpy[viz,xarray,dask,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/geoindex/geoindexpy"
Documentation = "https://geoindexpy.readthedocs.io"
Repository = "https://github.com/geoindex/geoindexpy"
Issues = "https://github.com/geoindex/geoindexpy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/geoindexpy"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "NPY", # numpy-specific rules
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
